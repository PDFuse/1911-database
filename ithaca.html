<!DOCTYPE html>
<html>
<head>
    <title>Ithaca 1911 Database</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Ithaca M1911A1 Serial Number Ranges</h1>

<p>Complete Ithaca production serial number ranges.</p>

<nav>
    <a href="index.html">Home</a>
    <a href="colt.html">Colt</a>
    <a href="ithaca.html">Ithaca</a>
</nav>

<table>
    <thead>
        <tr>
            <th>Year</th>
            <th>Serial Start</th>
            <th>Serial End</th>
            <th>Notes</th>
        </tr>
    </thead>

    <tbody id="ithacaTable"></tbody>
</table>

<script src="ithaca-data.js"></script>

<script>
const table = document.getElementById("ithacaTable");

ithacaData.forEach(function(pistol) {
    table.innerHTML += `
        <tr>
            <td>${pistol.year}</td>
            <td>${pistol.serial_start}</td>
            <td>${pistol.serial_end}</td>
            <td>${pistol.notes}</td>
        </tr>
    `;
});
</script>

</body>
    <footer>
    <p>U.S. Military M1911 & M1911A1 Database</p>
    <p>Historical collector reference only.</p>
</footer>
</html>
