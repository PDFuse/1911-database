<!DOCTYPE html>

<head>
<title>Colt 2335201</title>
<link rel="stylesheet" href="../style.css">
<style>
body{background:#121212;color:#f4f4f4;}
.record-wrap{max-width:1180px;margin:0 auto;padding:18px;}
.record-kicker{color:#c9a44c;font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:.8rem;margin-top:10px;}

.record-subtitle{color:#b9b9b9;font-size:1.05rem;max-width:850px;margin-bottom:18px;}

.hero-card,.summary-card,.panel,.note-box,.assessment-panel{background:#1d1d1d;border:1px solid #343434;border-radius:18px;overflow:hidden;box-shadow:0 18px 45px rgba(0,0,0,.25);}
.hero-card img{width:100%;display:block;background:#111;}
.hero-caption{padding:10px 14px;color:#b9b9b9;font-size:.95rem;text-align:center;}
.summary-card,.panel,.note-box,.assessment-panel{padding:18px;overflow:visible;}
.summary-card h2,.panel h2,.assessment-panel h2{margin-top:0;color:#fff;}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 16px;}
.badge{display:inline-flex;border-radius:999px;padding:7px 11px;font-size:.85rem;font-weight:700;background:#274b7a;color:#fff;}
.badge.gold{background:rgba(201,164,76,.16);color:#f0d38a;border:1px solid rgba(201,164,76,.45);}

.key-row span:first-child{color:#b9b9b9;}

.nav-strip{display:flex;overflow-x:auto;gap:8px;padding:4px 0 14px;margin:0 0 10px;}

.section-title{font-size:1.65rem;margin:30px 0 12px;color:#fff;border-left:5px solid #c9a44c;padding-left:12px;}
.card-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;}
.info-card{background:#1d1d1d;border:1px solid #343434;border-radius:16px;padding:15px;}
.info-card h3{margin:0 0 7px;color:#f0d38a;font-size:1.05rem;}
.info-card p{margin:0;color:#b9b9b9;line-height:1.45;}
.detail-table{width:100%;border-collapse:separate;border-spacing:0 8px;margin-top:10px;}
.detail-table th{color:#b9b9b9;text-align:left;font-size:.82rem;text-transform:uppercase;letter-spacing:.07em;padding:0 10px 4px;}

.detail-table td:first-child{border-left:1px solid #343434;border-radius:10px 0 0 10px;font-weight:700;color:#fff;}
.detail-table td:last-child{border-right:1px solid #343434;border-radius:0 10px 10px 0;color:#b9b9b9;}

.assessment-big{font-size:1.4rem;color:#f0d38a;font-weight:800;margin-bottom:8px;}
.score-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px;}
.score-card{background:#242424;border:1px solid #343434;border-radius:14px;padding:14px;text-align:center;}
.score-card strong{display:block;font-size:1.45rem;color:#f0d38a;margin-top:5px;}
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;}

.gallery img{width:100%;display:block;aspect-ratio:4/3;object-fit:cover;background:#111;}

.timeline{display:grid;gap:10px;margin-top:12px;}
.timeline-item{display:grid;grid-template-columns:95px 1fr;gap:12px;background:#1d1d1d;border:1px solid #343434;border-radius:14px;padding:13px;}
.timeline-item strong{color:#f0d38a;}
.timeline-item span,.note-box{color:#b9b9b9;line-height:1.5;}
.note-box strong{color:#fff;}

.print-note{font-size:.9rem;color:#b9b9b9;margin-top:8px;}
