<!DOCTYPE html>
<html>
<head>
<title>Colt 2335201</title>
<link rel="stylesheet" href="../style.css">
</head>

<body>

<script src="../header.js"></script>

<tr><td>Inspector Information</td><td>${pistol.inspector}</td></tr>
<tr><td>Finish</td><td>${pistol.finish}</td></tr>
<tr><td>Barrel</td><td>${pistol.barrel}</td></tr>

<tr><td>Matching Status</td><td>${pistol.matching_status}</td></tr>
<tr><td>CMP Status</td><td>${pistol.cmp_status}</td></tr>
<tr><td>Provenance</td><td>${pistol.provenance}</td></tr>
<tr><td>Collector Notes</td><td>${pistol.notes}</td></tr>
</table>

<h2>Photo-Based Observations</h2>

<table>
<tr><th>Area</th><th>Observation</th></tr>
<tr><td>Overall Configuration</td><td>The submitted photos show a WWII-style Colt M1911A1 configuration with parkerized finish appearance, brown checkered grips, and service-wear characteristics.</td></tr>
<tr><td>Finish</td><td>The visible finish appears consistent with a wartime parkerized Colt-type appearance, but finish originality should be confirmed with close-up inspection of markings, edges, and wear patterns.</td></tr>
<tr><td>Frame and Slide</td><td>The pistol should be reviewed for matching Colt production-period slide markings, frame markings, ordnance stamp, and G.H.D. inspection context.</td></tr>
<tr><td>Grips</td><td>The photos show brown checkered plastic-style grips consistent with common WWII M1911A1 collector review points.</td></tr>
<tr><td>Wear Pattern</td><td>Visible wear appears compatible with a handled service pistol; any final originality call should be based on detailed photos of serial number, inspector mark, slide legend, barrel, and small parts.</td></tr>
<tr><td>Collector Review</td><td>This pistol should be evaluated as a late-war Colt candidate by comparing serial range, G.H.D. inspection mark, slide markings, barrel markings, finish, and small parts together.</td></tr>
</table>

<h2>Verification Checklist</h2>

<div class="warning-box">
<ul>
${verificationHtml}
</ul>
</div>

<h2>Photo Gallery</h2>

<div class="photo-grid">

<div class="photo-slot">
<img src="${pistol.photos.left}" alt="Left Side">
<p class="photo-caption">Left Side</p>
</div>

<div class="photo-slot">
<img src="${pistol.photos.right}" alt="Right Side">
<p class="photo-caption">Right Side</p>
</div>

<div class="photo-slot">
<img src="${pistol.photos.serial}" alt="Serial Number">

</div>
