<h1>Colt M1911 & M1911A1 Serial Number Ranges</h1>

<p>

<table>

    <thead>
        <tr>
            <th>Year</th>
            <th>Serial Start</th>

<script src="colt-data.js"></script>

<script>

const table = document.getElementById("coltTable");

coltData.forEach(function(pistol) {

    table.innerHTML += `

        <tr>
            <td>${pistol.year}</td>
            <td>${pistol.serial_start}</td>
            <td>${pistol.serial_end}</td>
            <td>${pistol.notes}</td>
        </tr>

    `;

});

</script>
